<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang chuyển hướng...</title>

  <!-- Tailwind CSS (giống trang chính) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter (giống trang chính) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
      body {
          font-family: 'Inter', sans-serif;
          background-color: #f4f7f6; /* Màu nền giống trang chính */
      }

      /* Progress bar animation */
      @keyframes progress {
          from {
              width: 100%;
          }
          to {
              width: 0%;
          }
      }

      .progress-bar {
          /* Dùng CSS variable để control duration từ JavaScript
             var(--countdown-duration, 5s) = dùng variable nếu có, fallback 5s nếu không
          */
          animation: progress var(--countdown-duration, 5s) linear forwards;
      }

      /* Fade in animation */
      @keyframes fadeIn {
          from {
              opacity: 0;
              transform: translateY(20px);
          }
          to {
              opacity: 1;
              transform: translateY(0);
          }
      }

      .fade-in {
          animation: fadeIn 0.5s ease-out;
      }

      /* Pulse animation for countdown */
      @keyframes pulse {
          0%, 100% {
              transform: scale(1);
          }
          50% {
              transform: scale(1.05);
          }
      }

      .pulse {
          animation: pulse 1s ease-in-out infinite;
      }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full fade-in">
  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
    <!-- Icon -->
    <div class="mb-6">
      <div class="w-16 h-16 mx-auto bg-blue-100 rounded-full flex items-center justify-center">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 9l3 3m0 0l-3 3m3-3H8m13 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-slate-800 mb-3">
      🔄 Đang chuyển hướng
    </h1>

    <!-- Description -->
    <p class="text-slate-600 mb-6">
      Đường dẫn đã được cập nhật sang địa chỉ mới
    </p>

    <!-- Progress bar -->
    <div class="mb-6 bg-gray-200 rounded-full h-2 overflow-hidden">
      <div class="progress-bar bg-blue-600 h-full"></div>
    </div>

    <!-- Countdown -->
    <p class="text-slate-500 mb-6">
      Tự động chuyển sau <span id="countdown" class="font-bold text-blue-600 pulse">5</span> giây
    </p>

    <!-- Button -->
    <a id="redirect-link" href="#"
       class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg">
      Chuyển ngay
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  <!-- Footer -->
  <p class="text-center text-sm text-slate-500 mt-4">
    Powered by Hiếu iceTea 😉
  </p>
</div>
</body>

<script>
    // Final URL
    const targetUrl = '/err-chrome.html';

    // ============================================
    // COUNTDOWN & REDIRECT LOGIC
    // ============================================

    // ⚙️ CONFIGURATION - Single Source of Truth
    // Chỉ cần thay đổi số này, mọi thứ khác sẽ tự động sync:
    // - Countdown text sẽ đếm ngược từ số này
    // - Progress bar sẽ chạy đúng thời gian này
    let seconds = 6;

    // Set CSS variable để progress bar animation sync với countdown
    // CSS: animation: progress var(--countdown-duration, 5s)
    document.documentElement.style.setProperty('--countdown-duration', `${seconds}s`);

    // DOM elements
    const countdownElement = document.getElementById('countdown');
    const linkElement = document.getElementById('redirect-link');

    // Set link href
    linkElement.href = targetUrl;

    // Update countdown every second
    const interval = setInterval(() => {
        seconds--;
        countdownElement.textContent = seconds;

        if (seconds <= 0) {
            clearInterval(interval);
            // Sử dụng replace để không lưu trang redirect vào history
            window.location.replace(targetUrl);
            // window.location.href = targetUrl;
        }
    }, 1000);
</script>

</html>
